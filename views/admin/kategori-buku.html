<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kategori Buku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/admin/panel.css">
</head>
<body>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="main-content">
      <header class="topbar">
        <h2>Kategori Buku</h2>
        <p>Tambah, edit, dan hapus kategori buku.</p>
      </header>

      <section class="panel table-wrap">
        <div class="actions" style="justify-content:space-between; margin-bottom:14px;">
          <h3 style="margin:0;">Data Kategori</h3>
          <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createKategoriModal">Tambah Data</button>
        </div>
        <table id="kategoriTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Jumlah Buku</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="kategoriTableBody"></tbody>
        </table>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
          <p id="kategoriPaginationInfo" style="margin:0;color:var(--text-muted);"></p>
          <nav aria-label="Kategori pagination">
            <ul class="pagination pagination-sm mb-0" id="kategoriPagination">
              <li class="page-item" id="kategoriPrevItem"><button class="page-link" id="kategoriPrevBtn" type="button">Previous</button></li>
              <li class="page-item disabled"><span class="page-link" id="kategoriPageLabel">1</span></li>
              <li class="page-item" id="kategoriNextItem"><button class="page-link" id="kategoriNextBtn" type="button">Next</button></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="createKategoriModal" tabindex="-1" aria-labelledby="createKategoriModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createKategoriModalLabel">Tambah Kategori Buku</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid" id="createKategoriForm">
            <div class="field"><label>ID Kategori</label><input type="text" id="createKategoriId" value="KT-016"></div>
            <div class="field"><label>Nama Kategori</label><input type="text" id="createKategoriNama" value="Psikologi Populer"></div>
            <div class="field"><label>Jumlah Buku</label><input type="number" id="createKategoriJumlah" value="9"></div>
            <div class="field"><label>Status</label><select id="createKategoriStatus"><option selected>Aktif</option><option>Draft</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="saveCreateKategori">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editKategoriModal" tabindex="-1" aria-labelledby="editKategoriModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editKategoriModalLabel">Edit Kategori Buku</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid" id="editKategoriForm">
            <input type="hidden" id="editKategoriIdRef">
            <div class="field"><label>ID Kategori</label><input type="text" id="editKategoriId"></div>
            <div class="field"><label>Nama Kategori</label><input type="text" id="editKategoriNama"></div>
            <div class="field"><label>Jumlah Buku</label><input type="number" id="editKategoriJumlah"></div>
            <div class="field"><label>Status</label><select id="editKategoriStatus"><option>Aktif</option><option>Draft</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="saveEditKategori">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/script/admin/shared-layout.js"></script>
  <script>
    (function () {
      const pageSize = 10;
      let currentPage = 1;
      const kategoriData = [
        { id: "KT-001", nama: "Sastra Indonesia", jumlah: 48, status: "Aktif" },
        { id: "KT-002", nama: "Filsafat", jumlah: 21, status: "Aktif" },
        { id: "KT-003", nama: "Sosiologi", jumlah: 17, status: "Draft" },
        { id: "KT-004", nama: "Sejarah", jumlah: 14, status: "Aktif" },
        { id: "KT-005", nama: "Psikologi", jumlah: 26, status: "Aktif" },
        { id: "KT-006", nama: "Bisnis", jumlah: 19, status: "Aktif" },
        { id: "KT-007", nama: "Pendidikan", jumlah: 11, status: "Draft" },
        { id: "KT-008", nama: "Teknologi", jumlah: 23, status: "Aktif" },
        { id: "KT-009", nama: "Agama", jumlah: 35, status: "Aktif" },
        { id: "KT-010", nama: "Kesehatan", jumlah: 9, status: "Draft" },
        { id: "KT-011", nama: "Ekonomi", jumlah: 15, status: "Aktif" },
        { id: "KT-012", nama: "Hukum", jumlah: 13, status: "Aktif" },
        { id: "KT-013", nama: "Politik", jumlah: 10, status: "Draft" },
        { id: "KT-014", nama: "Budaya", jumlah: 12, status: "Aktif" },
        { id: "KT-015", nama: "Biografi", jumlah: 16, status: "Aktif" }
      ];

      const tableBody = document.getElementById("kategoriTableBody");
      const info = document.getElementById("kategoriPaginationInfo");
      const pageLabel = document.getElementById("kategoriPageLabel");
      const prevBtn = document.getElementById("kategoriPrevBtn");
      const nextBtn = document.getElementById("kategoriNextBtn");
      const prevItem = document.getElementById("kategoriPrevItem");
      const nextItem = document.getElementById("kategoriNextItem");
      const editModal = new bootstrap.Modal(document.getElementById("editKategoriModal"));

      function statusBadge(statusText) {
        const cls = statusText === "Aktif" ? "success" : "warning";
        return '<span class="badge ' + cls + '">' + statusText + "</span>";
      }

      function pageCount() {
        return Math.max(1, Math.ceil(kategoriData.length / pageSize));
      }

      function renderTable() {
        const totalPages = pageCount();
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const currentData = kategoriData.slice(start, end);

        if (!currentData.length) {
          tableBody.innerHTML = '<tr><td colspan="5">Data kategori kosong.</td></tr>';
        } else {
          tableBody.innerHTML = currentData.map(function (item) {
            return '<tr>' +
              "<td>" + item.id + "</td>" +
              "<td>" + item.nama + "</td>" +
              "<td>" + item.jumlah + "</td>" +
              "<td>" + statusBadge(item.status) + "</td>" +
              '<td><div class="actions">' +
              '<button class="btn btn-soft edit-btn" type="button" data-id="' + item.id + '" data-bs-toggle="modal" data-bs-target="#editKategoriModal">Edit</button>' +
              '<button class="btn btn-danger delete-btn" type="button" data-id="' + item.id + '">Hapus</button>' +
              "</div></td>" +
              "</tr>";
          }).join("");
        }

        info.textContent = "Halaman " + currentPage + " dari " + totalPages + " (Total " + kategoriData.length + " data)";
        pageLabel.textContent = currentPage + " / " + totalPages;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
        prevItem.classList.toggle("disabled", currentPage === 1);
        nextItem.classList.toggle("disabled", currentPage === totalPages);
      }

      tableBody.addEventListener("click", function (event) {
        const editBtn = event.target.closest(".edit-btn");
        const deleteBtn = event.target.closest(".delete-btn");

        if (editBtn) {
          const selected = kategoriData.find(function (item) { return item.id === editBtn.dataset.id; });
          if (!selected) return;
          document.getElementById("editKategoriIdRef").value = selected.id;
          document.getElementById("editKategoriId").value = selected.id;
          document.getElementById("editKategoriNama").value = selected.nama;
          document.getElementById("editKategoriJumlah").value = selected.jumlah;
          document.getElementById("editKategoriStatus").value = selected.status;
          return;
        }

        if (deleteBtn) {
          const index = kategoriData.findIndex(function (item) { return item.id === deleteBtn.dataset.id; });
          if (index === -1) return;
          kategoriData.splice(index, 1);
          renderTable();
        }
      });

      document.getElementById("saveCreateKategori").addEventListener("click", function () {
        const id = document.getElementById("createKategoriId").value.trim();
        const nama = document.getElementById("createKategoriNama").value.trim();
        const jumlah = Number(document.getElementById("createKategoriJumlah").value);
        const status = document.getElementById("createKategoriStatus").value;
        if (!id || !nama || !Number.isFinite(jumlah)) return;
        kategoriData.push({ id: id, nama: nama, jumlah: jumlah, status: status });
        currentPage = pageCount();
        renderTable();
        bootstrap.Modal.getInstance(document.getElementById("createKategoriModal")).hide();
      });

      document.getElementById("saveEditKategori").addEventListener("click", function () {
        const refId = document.getElementById("editKategoriIdRef").value;
        const target = kategoriData.find(function (item) { return item.id === refId; });
        if (!target) return;
        target.id = document.getElementById("editKategoriId").value.trim();
        target.nama = document.getElementById("editKategoriNama").value.trim();
        target.jumlah = Number(document.getElementById("editKategoriJumlah").value);
        target.status = document.getElementById("editKategoriStatus").value;
        renderTable();
        editModal.hide();
      });

      prevBtn.addEventListener("click", function () {
        if (currentPage > 1) {
          currentPage -= 1;
          renderTable();
        }
      });

      nextBtn.addEventListener("click", function () {
        if (currentPage < pageCount()) {
          currentPage += 1;
          renderTable();
        }
      });

      renderTable();
    })();
  </script>
</body>
</html>
