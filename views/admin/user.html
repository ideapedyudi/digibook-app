<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/admin/panel.css">
</head>
<body>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="main-content">
      <header class="topbar">
        <h2>User</h2>
        <p>Tambah, edit, dan hapus akun pengguna.</p>
      </header>

      <section class="panel table-wrap">
        <div class="actions" style="justify-content:space-between; margin-bottom:14px;">
          <h3 style="margin:0;">Data User</h3>
          <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createUserModal">Tambah Data</button>
        </div>
        <table id="userTable">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Admin Utama</td>
              <td>admin@galaxybook.id</td>
              <td>Admin</td>
              <td><span class="badge success">Aktif</span></td>
              <td>
                <div class="actions">
                  <button class="btn btn-soft edit-btn" type="button" data-bs-toggle="modal" data-bs-target="#editUserModal">Edit</button>
                  <button class="btn btn-danger delete-btn" type="button">Hapus</button>
                </div>
              </td>
            </tr>
            <tr>
              <td>Dina Kurnia</td>
              <td>dina@galaxybook.id</td>
              <td>Staff</td>
              <td><span class="badge success">Aktif</span></td>
              <td>
                <div class="actions">
                  <button class="btn btn-soft edit-btn" type="button" data-bs-toggle="modal" data-bs-target="#editUserModal">Edit</button>
                  <button class="btn btn-danger delete-btn" type="button">Hapus</button>
                </div>
              </td>
            </tr>
            <tr>
              <td>Rafi Maulana</td>
              <td>rafi@galaxybook.id</td>
              <td>Staff</td>
              <td><span class="badge warning">Suspend</span></td>
              <td>
                <div class="actions">
                  <button class="btn btn-soft edit-btn" type="button" data-bs-toggle="modal" data-bs-target="#editUserModal">Edit</button>
                  <button class="btn btn-danger delete-btn" type="button">Hapus</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <div class="modal fade" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createUserModalLabel">Tambah User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <div class="field"><label>Nama Lengkap</label><input type="text" id="createNama" value="Nadia Putri"></div>
            <div class="field"><label>Email</label><input type="email" id="createEmail" value="nadia@galaxybook.id"></div>
            <div class="field"><label>Role</label><select id="createRole"><option>Admin</option><option selected>Staff</option></select></div>
            <div class="field"><label>Status</label><select id="createStatus"><option selected>Aktif</option><option>Suspend</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="saveCreateUser">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <input type="hidden" id="editUserRowIndex">
            <div class="field"><label>Nama Lengkap</label><input type="text" id="editNama"></div>
            <div class="field"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="field"><label>Role</label><select id="editRole"><option>Admin</option><option>Staff</option></select></div>
            <div class="field"><label>Status</label><select id="editStatus"><option>Aktif</option><option>Suspend</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="saveEditUser">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/script/admin/shared-layout.js"></script>
  <script>
    (function () {
      const tableBody = document.querySelector("#userTable tbody");
      const editModalElement = document.getElementById("editUserModal");
      const editModal = new bootstrap.Modal(editModalElement);

      function statusBadge(statusText) {
        const cls = statusText === "Aktif" ? "success" : "warning";
        return '<span class="badge ' + cls + '">' + statusText + "</span>";
      }

      function actionButtons() {
        return '<div class="actions"><button class="btn btn-soft edit-btn" type="button" data-bs-toggle="modal" data-bs-target="#editUserModal">Edit</button><button class="btn btn-danger delete-btn" type="button">Hapus</button></div>';
      }

      tableBody.addEventListener("click", function (event) {
        const row = event.target.closest("tr");
        if (!row) return;
        if (event.target.classList.contains("delete-btn")) {
          row.remove();
          return;
        }
        if (event.target.classList.contains("edit-btn")) {
          const cells = row.querySelectorAll("td");
          document.getElementById("editUserRowIndex").value = Array.from(tableBody.children).indexOf(row);
          document.getElementById("editNama").value = cells[0].textContent.trim();
          document.getElementById("editEmail").value = cells[1].textContent.trim();
          document.getElementById("editRole").value = cells[2].textContent.trim();
          document.getElementById("editStatus").value = cells[3].textContent.trim();
        }
      });

      document.getElementById("saveCreateUser").addEventListener("click", function () {
        const nama = document.getElementById("createNama").value.trim();
        const email = document.getElementById("createEmail").value.trim();
        const role = document.getElementById("createRole").value;
        const status = document.getElementById("createStatus").value;
        if (!nama || !email) return;
        const row = document.createElement("tr");
        row.innerHTML = "<td>" + nama + "</td><td>" + email + "</td><td>" + role + "</td><td>" + statusBadge(status) + "</td><td>" + actionButtons() + "</td>";
        tableBody.appendChild(row);
        bootstrap.Modal.getInstance(document.getElementById("createUserModal")).hide();
      });

      document.getElementById("saveEditUser").addEventListener("click", function () {
        const rowIndex = parseInt(document.getElementById("editUserRowIndex").value, 10);
        const row = tableBody.children[rowIndex];
        if (!row) return;
        row.children[0].textContent = document.getElementById("editNama").value.trim();
        row.children[1].textContent = document.getElementById("editEmail").value.trim();
        row.children[2].textContent = document.getElementById("editRole").value;
        row.children[3].innerHTML = statusBadge(document.getElementById("editStatus").value);
        editModal.hide();
      });
    })();
  </script>
</body>
</html>
