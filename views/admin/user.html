<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/admin/panel.css">
</head>
<body>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="main-content">
      <header class="topbar">
        <h2>User</h2>
        <p>Tambah, edit, dan hapus akun pengguna.</p>
      </header>

      <section class="panel table-wrap">
        <div class="actions" style="justify-content:space-between; margin-bottom:14px;">
          <h3 style="margin:0;">Data User</h3>
          <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createUserModal">Tambah Data</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
          <p id="userPaginationInfo" style="margin:0;color:var(--text-muted);"></p>
          <nav aria-label="User pagination">
            <ul class="pagination pagination-sm mb-0" id="userPagination">
              <li class="page-item" id="userPrevItem"><button class="page-link" id="userPrevBtn" type="button">Previous</button></li>
              <li class="page-item disabled"><span class="page-link" id="userPageLabel">1</span></li>
              <li class="page-item" id="userNextItem"><button class="page-link" id="userNextBtn" type="button">Next</button></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="createUserModal" tabindex="-1" aria-labelledby="createUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createUserModalLabel">Tambah User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <div class="field"><label>Nama Lengkap</label><input type="text" id="createNama" value="Nadia Putri"></div>
            <div class="field"><label>Email</label><input type="email" id="createEmail" value="nadia@galaxybook.id"></div>
            <div class="field"><label>Role</label><select id="createRole"><option>Admin</option><option selected>Staff</option></select></div>
            <div class="field"><label>Status</label><select id="createStatus"><option selected>Aktif</option><option>Suspend</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="saveCreateUser">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editUserModalLabel">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <input type="hidden" id="editRefEmail">
            <div class="field"><label>Nama Lengkap</label><input type="text" id="editNama"></div>
            <div class="field"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="field"><label>Role</label><select id="editRole"><option>Admin</option><option>Staff</option></select></div>
            <div class="field"><label>Status</label><select id="editStatus"><option>Aktif</option><option>Suspend</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="saveEditUser">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/script/admin/shared-layout.js"></script>
  <script>
    (function () {
      const pageSize = 10;
      let currentPage = 1;
      const userData = [
        { nama: "Admin Utama", email: "admin@galaxybook.id", role: "Admin", status: "Aktif" },
        { nama: "Dina Kurnia", email: "dina@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Rafi Maulana", email: "rafi@galaxybook.id", role: "Staff", status: "Suspend" },
        { nama: "Sinta Aulia", email: "sinta@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Bagas Pratama", email: "bagas@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Nadia Putri", email: "nadia@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Andi Rahman", email: "andi@galaxybook.id", role: "Staff", status: "Suspend" },
        { nama: "Lia Ramadhani", email: "lia@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Reno Saputra", email: "reno@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Tia Lestari", email: "tia@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Yusuf Hamka", email: "yusuf@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Citra Nabila", email: "citra@galaxybook.id", role: "Staff", status: "Suspend" },
        { nama: "Farhan Hakim", email: "farhan@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Mila Handayani", email: "mila@galaxybook.id", role: "Staff", status: "Aktif" },
        { nama: "Raka Aditya", email: "raka@galaxybook.id", role: "Staff", status: "Aktif" }
      ];

      const tableBody = document.getElementById("userTableBody");
      const info = document.getElementById("userPaginationInfo");
      const pageLabel = document.getElementById("userPageLabel");
      const prevBtn = document.getElementById("userPrevBtn");
      const nextBtn = document.getElementById("userNextBtn");
      const prevItem = document.getElementById("userPrevItem");
      const nextItem = document.getElementById("userNextItem");
      const editModal = new bootstrap.Modal(document.getElementById("editUserModal"));

      function statusBadge(statusText) {
        const cls = statusText === "Aktif" ? "success" : "warning";
        return '<span class="badge ' + cls + '">' + statusText + "</span>";
      }

      function pageCount() {
        return Math.max(1, Math.ceil(userData.length / pageSize));
      }

      function renderTable() {
        const totalPages = pageCount();
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const currentData = userData.slice(start, start + pageSize);

        if (!currentData.length) {
          tableBody.innerHTML = '<tr><td colspan="5">Data user kosong.</td></tr>';
        } else {
          tableBody.innerHTML = currentData.map(function (item) {
            return "<tr>" +
              "<td>" + item.nama + "</td>" +
              "<td>" + item.email + "</td>" +
              "<td>" + item.role + "</td>" +
              "<td>" + statusBadge(item.status) + "</td>" +
              '<td><div class="actions">' +
              '<button class="btn btn-soft edit-btn" type="button" data-email="' + item.email + '" data-bs-toggle="modal" data-bs-target="#editUserModal">Edit</button>' +
              '<button class="btn btn-danger delete-btn" type="button" data-email="' + item.email + '">Hapus</button>' +
              "</div></td>" +
              "</tr>";
          }).join("");
        }

        info.textContent = "Halaman " + currentPage + " dari " + totalPages + " (Total " + userData.length + " data)";
        pageLabel.textContent = currentPage + " / " + totalPages;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
        prevItem.classList.toggle("disabled", currentPage === 1);
        nextItem.classList.toggle("disabled", currentPage === totalPages);
      }

      tableBody.addEventListener("click", function (event) {
        const editBtn = event.target.closest(".edit-btn");
        const deleteBtn = event.target.closest(".delete-btn");

        if (editBtn) {
          const selected = userData.find(function (item) { return item.email === editBtn.dataset.email; });
          if (!selected) return;
          document.getElementById("editRefEmail").value = selected.email;
          document.getElementById("editNama").value = selected.nama;
          document.getElementById("editEmail").value = selected.email;
          document.getElementById("editRole").value = selected.role;
          document.getElementById("editStatus").value = selected.status;
          return;
        }

        if (deleteBtn) {
          const index = userData.findIndex(function (item) { return item.email === deleteBtn.dataset.email; });
          if (index === -1) return;
          userData.splice(index, 1);
          renderTable();
        }
      });

      document.getElementById("saveCreateUser").addEventListener("click", function () {
        const entry = {
          nama: document.getElementById("createNama").value.trim(),
          email: document.getElementById("createEmail").value.trim(),
          role: document.getElementById("createRole").value,
          status: document.getElementById("createStatus").value
        };
        if (!entry.nama || !entry.email) return;
        userData.push(entry);
        currentPage = pageCount();
        renderTable();
        bootstrap.Modal.getInstance(document.getElementById("createUserModal")).hide();
      });

      document.getElementById("saveEditUser").addEventListener("click", function () {
        const refEmail = document.getElementById("editRefEmail").value;
        const target = userData.find(function (item) { return item.email === refEmail; });
        if (!target) return;
        target.nama = document.getElementById("editNama").value.trim();
        target.email = document.getElementById("editEmail").value.trim();
        target.role = document.getElementById("editRole").value;
        target.status = document.getElementById("editStatus").value;
        renderTable();
        editModal.hide();
      });

      prevBtn.addEventListener("click", function () {
        if (currentPage > 1) {
          currentPage -= 1;
          renderTable();
        }
      });

      nextBtn.addEventListener("click", function () {
        if (currentPage < pageCount()) {
          currentPage += 1;
          renderTable();
        }
      });

      renderTable();
    })();
  </script>
</body>
</html>
