<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Buat Buku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/admin/panel.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="brand"><img src="../../assets/pic/logo.png" alt="Logo" class="logo"><div><h1>BookStore</h1><p>Admin Panel</p></div></div>
      <nav class="menu">
        <a href="kategori-buku.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Kategori Buku</a>
        <a href="buat-buku.html" class="menu-item active"><i class="fa-solid fa-square-plus"></i> Buat Buku</a>
        <a href="transaksi.html" class="menu-item"><i class="fa-solid fa-money-bill-transfer"></i> Transaksi</a>
        <a href="report.html" class="menu-item"><i class="fa-solid fa-chart-line"></i> Report</a>
        <a href="user.html" class="menu-item"><i class="fa-solid fa-users"></i> User</a>
      </nav>
      <a href="../auth/auth.html" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>
    <main class="main-content">
      <header class="topbar"><h2>Buat Buku</h2><p>Input buku baru ke katalog penjualan.</p></header>
      <section class="panel">
        <h3>Form Input Buku</h3>
        <form class="form-grid">
          <div class="field"><label>Judul Buku</label><input type="text" value="Perubahan Sosial Dalam Masyarakat"></div>
          <div class="field"><label>Penulis</label><input type="text" value="Kuntowijoyo"></div>
          <div class="field"><label>Kategori</label><select><option>Sosiologi</option><option>Sastra Indonesia</option><option>Filsafat</option></select></div>
          <div class="field"><label>Harga</label><input type="number" value="200000"></div>
          <div class="field"><label>Stok</label><input type="number" value="34"></div>
          <div class="field"><label>Tahun Terbit</label><input type="number" value="2024"></div>
          <div class="field full"><label>Deskripsi</label><textarea>Buku ini membahas dinamika perubahan sosial di masyarakat modern.</textarea></div>
          <div class="field"><label>Cover (URL)</label><input type="text" value="../../assets/pic/b-3.png"></div>
          <div class="field" style="justify-content:end;"><label>&nbsp;</label><div class="actions"><button class="btn btn-soft" type="button">Reset</button><button class="btn btn-primary" type="button">Publish</button></div></div>
        </form>
      </section>
    </main>
  </div>
    <script src="../../assets/script/admin/theme.js"></script>
</body>
</html>
