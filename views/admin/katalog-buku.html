<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Katalog Buku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/admin/panel.css">
</head>
<body>
  <div class="admin-layout">
    <div id="admin-sidebar"></div>
    <main class="main-content">
      <header class="topbar">
        <h2>Katalog Buku</h2>
        <p>Tambah, edit, dan hapus data katalog buku.</p>
      </header>

      <section class="panel table-wrap">
        <div class="actions" style="justify-content:space-between; margin-bottom:14px;">
          <h3 style="margin:0;">List Buku Katalog</h3>
          <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#createKatalogModal">Tambah Data</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Judul</th>
              <th>Penulis</th>
              <th>Kategori</th>
              <th>Harga</th>
              <th>Stok</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="katalogTableBody"></tbody>
        </table>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
          <p id="katalogPaginationInfo" style="margin:0;color:var(--text-muted);"></p>
          <nav aria-label="Katalog pagination">
            <ul class="pagination pagination-sm mb-0" id="katalogPagination">
              <li class="page-item" id="katalogPrevItem"><button class="page-link" id="katalogPrevBtn" type="button">Previous</button></li>
              <li class="page-item disabled"><span class="page-link" id="katalogPageLabel">1</span></li>
              <li class="page-item" id="katalogNextItem"><button class="page-link" id="katalogNextBtn" type="button">Next</button></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>
  </div>

  <div class="modal fade" id="createKatalogModal" tabindex="-1" aria-labelledby="createKatalogModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="createKatalogModalLabel">Tambah Buku</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <div class="field"><label>ID Buku</label><input type="text" id="createId" value="BK-016"></div>
            <div class="field"><label>Judul Buku</label><input type="text" id="createJudul" value="Laut Bercerita"></div>
            <div class="field"><label>Penulis</label><input type="text" id="createPenulis" value="Leila S. Chudori"></div>
            <div class="field"><label>Kategori</label><select id="createKategori"><option>Sastra Indonesia</option><option>Sosiologi</option><option>Filsafat</option></select></div>
            <div class="field"><label>Harga</label><input type="number" id="createHarga" value="118000"></div>
            <div class="field"><label>Stok</label><input type="number" id="createStok" value="24"></div>
            <div class="field"><label>Status</label><select id="createStatus"><option selected>Aktif</option><option>Draft</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary" id="saveCreateKatalog">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editKatalogModal" tabindex="-1" aria-labelledby="editKatalogModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editKatalogModalLabel">Edit Buku</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="form-grid">
            <input type="hidden" id="editRefId">
            <div class="field"><label>ID Buku</label><input type="text" id="editId"></div>
            <div class="field"><label>Judul Buku</label><input type="text" id="editJudul"></div>
            <div class="field"><label>Penulis</label><input type="text" id="editPenulis"></div>
            <div class="field"><label>Kategori</label><select id="editKategori"><option>Sastra Indonesia</option><option>Sosiologi</option><option>Filsafat</option></select></div>
            <div class="field"><label>Harga</label><input type="number" id="editHarga"></div>
            <div class="field"><label>Stok</label><input type="number" id="editStok"></div>
            <div class="field"><label>Status</label><select id="editStatus"><option>Aktif</option><option>Draft</option></select></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary" id="saveEditKatalog">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/script/admin/shared-layout.js"></script>
  <script>
    (function () {
      const pageSize = 10;
      let currentPage = 1;
      const katalogData = [
        { id: "BK-001", judul: "Makrifat Daun", penulis: "Kuntowijoyo", kategori: "Sosiologi", harga: 50000, stok: 42, status: "Aktif" },
        { id: "BK-002", judul: "Perubahan Sosial Dalam Masyarakat", penulis: "Kuntowijoyo", kategori: "Sosiologi", harga: 200000, stok: 34, status: "Aktif" },
        { id: "BK-003", judul: "Pulang", penulis: "Tere Liye", kategori: "Sastra Indonesia", harga: 98000, stok: 27, status: "Aktif" },
        { id: "BK-004", judul: "Dilarang Mencintai Bunga-Bunga", penulis: "Kuntowijoyo", kategori: "Sastra Indonesia", harga: 135000, stok: 18, status: "Aktif" },
        { id: "BK-005", judul: "Pengantar Filsafat Modern", penulis: "Franz Magnis", kategori: "Filsafat", harga: 150000, stok: 6, status: "Draft" },
        { id: "BK-006", judul: "Laut Bercerita", penulis: "Leila S. Chudori", kategori: "Sastra Indonesia", harga: 118000, stok: 20, status: "Aktif" },
        { id: "BK-007", judul: "Bumi Manusia", penulis: "Pramoedya", kategori: "Sastra Indonesia", harga: 95000, stok: 16, status: "Aktif" },
        { id: "BK-008", judul: "Madilog", penulis: "Tan Malaka", kategori: "Filsafat", harga: 125000, stok: 11, status: "Aktif" },
        { id: "BK-009", judul: "Sapiens", penulis: "Yuval Harari", kategori: "Sejarah", harga: 185000, stok: 8, status: "Aktif" },
        { id: "BK-010", judul: "Atomic Habits", penulis: "James Clear", kategori: "Psikologi", harga: 145000, stok: 30, status: "Aktif" },
        { id: "BK-011", judul: "Filosofi Teras", penulis: "Henry Manampiring", kategori: "Filsafat", harga: 102000, stok: 19, status: "Aktif" },
        { id: "BK-012", judul: "Negeri 5 Menara", penulis: "A. Fuadi", kategori: "Sastra Indonesia", harga: 88000, stok: 12, status: "Draft" },
        { id: "BK-013", judul: "Hujan", penulis: "Tere Liye", kategori: "Sastra Indonesia", harga: 97000, stok: 25, status: "Aktif" },
        { id: "BK-014", judul: "Thinking Fast and Slow", penulis: "Daniel Kahneman", kategori: "Psikologi", harga: 175000, stok: 7, status: "Aktif" },
        { id: "BK-015", judul: "The Art of War", penulis: "Sun Tzu", kategori: "Sejarah", harga: 76000, stok: 14, status: "Draft" }
      ];

      const tableBody = document.getElementById("katalogTableBody");
      const info = document.getElementById("katalogPaginationInfo");
      const pageLabel = document.getElementById("katalogPageLabel");
      const prevBtn = document.getElementById("katalogPrevBtn");
      const nextBtn = document.getElementById("katalogNextBtn");
      const prevItem = document.getElementById("katalogPrevItem");
      const nextItem = document.getElementById("katalogNextItem");
      const editModal = new bootstrap.Modal(document.getElementById("editKatalogModal"));

      function statusBadge(statusText) {
        const cls = statusText === "Aktif" ? "success" : "warning";
        return '<span class="badge ' + cls + '">' + statusText + "</span>";
      }

      function pageCount() {
        return Math.max(1, Math.ceil(katalogData.length / pageSize));
      }

      function renderTable() {
        const totalPages = pageCount();
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const currentData = katalogData.slice(start, start + pageSize);

        if (!currentData.length) {
          tableBody.innerHTML = '<tr><td colspan="8">Data buku kosong.</td></tr>';
        } else {
          tableBody.innerHTML = currentData.map(function (item) {
            return "<tr>" +
              "<td>" + item.id + "</td>" +
              "<td>" + item.judul + "</td>" +
              "<td>" + item.penulis + "</td>" +
              "<td>" + item.kategori + "</td>" +
              "<td>" + item.harga + "</td>" +
              "<td>" + item.stok + "</td>" +
              "<td>" + statusBadge(item.status) + "</td>" +
              '<td><div class="actions">' +
              '<button class="btn btn-soft edit-btn" type="button" data-id="' + item.id + '" data-bs-toggle="modal" data-bs-target="#editKatalogModal">Edit</button>' +
              '<button class="btn btn-danger delete-btn" type="button" data-id="' + item.id + '">Hapus</button>' +
              "</div></td>" +
              "</tr>";
          }).join("");
        }

        info.textContent = "Halaman " + currentPage + " dari " + totalPages + " (Total " + katalogData.length + " data)";
        pageLabel.textContent = currentPage + " / " + totalPages;
        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;
        prevItem.classList.toggle("disabled", currentPage === 1);
        nextItem.classList.toggle("disabled", currentPage === totalPages);
      }

      tableBody.addEventListener("click", function (event) {
        const editBtn = event.target.closest(".edit-btn");
        const deleteBtn = event.target.closest(".delete-btn");

        if (editBtn) {
          const selected = katalogData.find(function (item) { return item.id === editBtn.dataset.id; });
          if (!selected) return;
          document.getElementById("editRefId").value = selected.id;
          document.getElementById("editId").value = selected.id;
          document.getElementById("editJudul").value = selected.judul;
          document.getElementById("editPenulis").value = selected.penulis;
          document.getElementById("editKategori").value = selected.kategori;
          document.getElementById("editHarga").value = selected.harga;
          document.getElementById("editStok").value = selected.stok;
          document.getElementById("editStatus").value = selected.status;
          return;
        }

        if (deleteBtn) {
          const index = katalogData.findIndex(function (item) { return item.id === deleteBtn.dataset.id; });
          if (index === -1) return;
          katalogData.splice(index, 1);
          renderTable();
        }
      });

      document.getElementById("saveCreateKatalog").addEventListener("click", function () {
        const entry = {
          id: document.getElementById("createId").value.trim(),
          judul: document.getElementById("createJudul").value.trim(),
          penulis: document.getElementById("createPenulis").value.trim(),
          kategori: document.getElementById("createKategori").value,
          harga: Number(document.getElementById("createHarga").value),
          stok: Number(document.getElementById("createStok").value),
          status: document.getElementById("createStatus").value
        };
        if (!entry.id || !entry.judul || !entry.penulis) return;
        katalogData.push(entry);
        currentPage = pageCount();
        renderTable();
        bootstrap.Modal.getInstance(document.getElementById("createKatalogModal")).hide();
      });

      document.getElementById("saveEditKatalog").addEventListener("click", function () {
        const refId = document.getElementById("editRefId").value;
        const target = katalogData.find(function (item) { return item.id === refId; });
        if (!target) return;
        target.id = document.getElementById("editId").value.trim();
        target.judul = document.getElementById("editJudul").value.trim();
        target.penulis = document.getElementById("editPenulis").value.trim();
        target.kategori = document.getElementById("editKategori").value;
        target.harga = Number(document.getElementById("editHarga").value);
        target.stok = Number(document.getElementById("editStok").value);
        target.status = document.getElementById("editStatus").value;
        renderTable();
        editModal.hide();
      });

      prevBtn.addEventListener("click", function () {
        if (currentPage > 1) {
          currentPage -= 1;
          renderTable();
        }
      });

      nextBtn.addEventListener("click", function () {
        if (currentPage < pageCount()) {
          currentPage += 1;
          renderTable();
        }
      });

      renderTable();
    })();
  </script>
</body>
</html>
