<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koleksi Kami - Galaxy Digi Book</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/css/user/koleksi.css">
</head>

<body>
    <header class="header">
        <nav class="navbar navbar-expand-lg py-3">
            <div class="container">
                <img src="../../assets/pic/logo.png" alt="Logo" width="70rem" height="70rem">
                <a class="navbar-brand" href="index.html">BookStore</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="searchbar col-lg-4">
                    <form>
                        <input type="text" placeholder="Cari judul buku">
                    </form>
                </div>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto me-5">
                        <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link active" href="koleksi.html">Koleksi Kami</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#kontak">Kontak Kami</a></li>
                    </ul>

                    <div class="social-links">
                        <a href=""><i class="fa-solid fa-user"></i></a>
                        <a href=""><i class="fa-solid fa-right-from-bracket"></i></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="collection-page">
        <section class="container py-5">
            <div class="hero-box mb-4">
                <h1>Koleksi Buku</h1>
                <p>Cari buku berdasarkan judul/penulis dan filter berdasarkan kategori.</p>
            </div>

            <section class="filters mb-4">
                <div class="filter-grid">
                    <div class="search-wrap">
                        <label for="searchInput" class="form-label">Cari Buku</label>
                        <input id="searchInput" type="text" class="form-control" placeholder="Contoh: Makrifat, Kuntowijoyo">
                    </div>

                    <div class="category-wrap">
                        <label for="categorySelect" class="form-label">Kategori</label>
                        <select id="categorySelect" class="form-select">
                            <option value="sastra" selected>Sastra Indonesia</option>
                            <option value="filsafat">Filsafat</option>
                            <option value="sosiologi">Sosiologi</option>
                            <option value="agama">Agama</option>
                            <option value="sejarah">Sejarah</option>
                            <option value="all">Semua Kategori</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <p id="resultInfo" class="result-info"></p>
                <div id="bookGrid" class="book-grid"></div>
            </section>
        </section>
    </main>

    <script src="../../assets/script/user/koleksi.js"></script>
</body>

</html>
